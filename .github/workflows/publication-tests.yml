name: Publication script tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/**
      - package.json

permissions:
  contents: read

jobs:
  site-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs

# XRB_REDEPLOY_ONLY_V1: no app source build or publication writer in Actions.
name: Deploy committed site to Pages
run-name: Redeploy site ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact public main commit whose complete docs tree is to be deployed
        required: true
        type: string
      request_id:
        description: Panel correlation ID
        required: true
        type: string

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://xrbuild.dev/
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate exact committed complete site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: node scripts/dispatch.mjs validate
      - name: Confirm main has not advanced
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_COMMIT"
      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/
      - name: Confirm deployment is still current
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_COMMIT"
      - name: Deploy complete Pages site
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify deployed complete site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dispatch.mjs verify

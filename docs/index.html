<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f141c">
  <title>XR Build</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { background: #0f141c; color: #e9edf4; }
    main { display: grid; place-items: center; min-height: 100vh; min-height: 100svh; padding: 24px; }
    .placeholder { width: min(650px, 100%); }
    h1 { margin: 0 0 22px; font-size: 1.5rem; line-height: 1.25; font-weight: 700; text-align: center; letter-spacing: -.025em; }
    .card { display: flex; align-items: center; gap: 26px; min-height: 134px; padding: 26px 32px; border: 1px solid #2b3746; border-radius: 12px; background: #171e28; box-shadow: 0 18px 60px #05080d42; }
    .mark { position: relative; display: grid; place-items: center; width: 68px; height: 68px; flex: none; }
    .mark::before { content: ""; position: absolute; inset: 2px; border: 1px solid #7596c24d; border-top-color: #9fbaffb3; border-bottom-color: #9fbaff78; border-radius: 50%; animation: orbit 12s linear infinite; }
    .mark svg { position: relative; width: 48px; height: 48px; filter: drop-shadow(0 0 9px #7497e552); animation: float 5s ease-in-out infinite; }
    h2 { margin: 0 0 4px; font-size: 1.5rem; line-height: 1.3; font-weight: 700; letter-spacing: -.025em; }
    p { margin: 0; color: #a6b1c2; font-size: 1rem; line-height: 1.5; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes float { 50% { transform: translateY(-4px) rotate(5deg); } }
    @media (max-width: 520px) {
      .card { gap: 16px; padding: 24px 20px; }
      .mark { width: 54px; height: 54px; }
      .mark svg { width: 40px; height: 40px; }
      h2 { font-size: 1.2rem; }
      p { font-size: .9rem; }
    }
    @media (prefers-reduced-motion: reduce) { .mark::before, .mark svg { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="placeholder">
      <h1>XR Build</h1>
      <section class="card" aria-labelledby="message">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="m24 3 19 10.5v21L24 45 5 34.5v-21L24 3Z" fill="#7b9be2" fill-opacity=".08" stroke="#9bb8f2" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M5 13.5 24 24l19-10.5M24 24v21" stroke="#9bb8f2" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h2 id="message">Taking shape</h2>
          <p>A home for XR experiences.</p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
